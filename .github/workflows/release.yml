name: 'Release Anchor'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0) — leave empty to use current ref'
        required: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Desktop: Windows, Linux, macOS (Tauri)
  # ─────────────────────────────────────────────────────────────
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libglib2.0-dev libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build / release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used by Tauri to create signed updater artifacts and latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name || 'v__AUTO__' }}
          releaseName: 'Anchor ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            **Anchor ${{ inputs.tag || github.ref_name }}** — calm, local-first workspace.

            ### Desktop bundles
            - **Windows** — `msi` + `nsis` (x64)
            - **Linux** — `AppImage` + `deb` (x64)
            - **macOS** — `dmg` (Apple Silicon `aarch64` + Intel `x86_64` — two separate jobs)

            ### Android
            Built in a separate `android` workflow job as a universal release APK and AAB for direct distribution.

            > Install: download your platform's installer. Desktop updater artifacts are signed; macOS app bundles may still require the normal first-run security approval.
            > Web stays live at https://anchor-chi-eight.vercel.app
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ─────────────────────────────────────────────────────────────
  # Android — Tauri 2 Android (APK + AAB)
  # ─────────────────────────────────────────────────────────────
  android:
    needs: publish-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Init Android project (if missing)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri android init
          fi

      - name: Configure Android release signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/anchor-release.p12"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/anchor-release.p12"
            echo "storeType=PKCS12"
          } > src-tauri/gen/android/keystore.properties
          node scripts/prepare-android-signing.mjs

      - name: Build Android release APK & AAB
        run: npm run tauri android build -- --ci --apk true --aab true

      - name: Collect Android artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "Finding Android APK/AAB artifacts..."
          mkdir -p dist-android
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print
          while IFS= read -r -d '' artifact; do
            cp "$artifact" "dist-android/Anchor-${RELEASE_TAG}-$(basename "$artifact")"
          done < <(find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print0)
          test -n "$(find dist-android -type f -print -quit)"
          ls -lh dist-android/

      - name: Upload Android to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist-android/* --repo "$GITHUB_REPOSITORY" --clobber

      # Always upload as artifact so workflow_dispatch also saves files
      - name: Upload Android artifacts (action artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-android-apk-aab
          path: dist-android/*
          if-no-files-found: warn
