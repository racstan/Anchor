[package]
name = "anchor"
version = "0.1.14"
description = "A steady place for the context that matters."
authors = ["Anchor"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "anchor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-android-installer = "0.1.0"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-fs = "2.5.2"
tauri-plugin-upload = "2.4.1"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.5"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
